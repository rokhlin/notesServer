name: Release Server & Update Changelog

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Specific release version (leave blank to auto-bump, e.g. 0.0.2)'
        required: false
        type: string
        default: ''
      bump_type:
        description: 'SemVer bump type (used if specific version is blank)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

permissions:
  contents: write

jobs:
  release:
    name: Build Server Release & Publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare Release, Changelog & Version Bump
        id: prep
        env:
          INPUT_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          INPUT_BUMP_TYPE: ${{ github.event.inputs.bump_type }}
        run: node .github/workflows/scripts/prepare-release.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Grant Execute Permission to gradlew
        run: chmod +x gradlew

      - name: Build Server Distribution
        run: |
          ./gradlew check test build installDist distZip distTar --no-daemon

      - name: Package Release Assets
        id: package
        run: |
          VERSION="${{ steps.prep.outputs.version }}"
          mkdir -p release-artifacts
          
          # Copy distributions and jars
          if [ -d "build/distributions" ]; then
            cp build/distributions/* release-artifacts/ || true
          fi
          if [ -d "build/libs" ]; then
            cp build/libs/*.jar release-artifacts/ || true
          fi

      - name: Commit & Push Version Bump and Changelog
        run: |
          git add gradle.properties CHANGELOG.md
          git commit -m "chore(release): bump version to ${{ steps.prep.outputs.version }} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Git Tag
        run: |
          TAG="${{ steps.prep.outputs.tag }}"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.tag }}
          name: Notes Server Release ${{ steps.prep.outputs.tag }}
          body_path: ${{ steps.prep.outputs.release_notes_path }}
          files: |
            release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
